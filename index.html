<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MES接口文档</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="MES制造执行系统接口文档">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #4A90D9;
      --sidebar-width: 280px;
      --sidebar-nav-link-color--active: #4A90D9;
      --sidebar-nav-link-border-color--active: #4A90D9;
      --cover-background-color: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    .sidebar .app-name {
      text-align: center;
      padding: 20px 0;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section code {
      background: #f6f8fa;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 85%;
    }
    .markdown-section pre > code {
      background: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'MES接口文档',
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: false,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索接口...',
        noData: '没有找到结果',
        depth: 3
      },
      copyCode: {
        buttonText: '复制',
        successText: '已复制'
      },
      formatUpdated: '{YYYY}/{MM}/{DD}',
      pagination: {
        previousText: '上一接口',
        nextText: '下一接口',
        crossChapter: true
      },
      // 右侧导航
      toc: {
        tocDepth: 3,
        target: 'h2, h3'
      }
    }
  </script>
  <!-- Docsify 核心 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- 插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <!-- 中文 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/i18n/zh-cn.min.js"></script>
</body>
</html>
